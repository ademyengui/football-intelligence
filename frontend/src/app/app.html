<div class="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
  <!-- Global Navigation Header -->
  <header class="sticky top-0 z-40 w-full border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3.5">
      <!-- Brand Logo -->
      <a routerLink="/" class="flex items-center gap-3 transition hover:opacity-90">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white shadow-lg shadow-blue-500/20">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <span class="text-base font-extrabold tracking-tight text-white">Football Intelligence</span>
          <span class="ml-2 rounded-md bg-blue-950 px-2 py-0.5 text-[10px] font-semibold text-blue-400 border border-blue-500/30">v1.0</span>
        </div>
      </a>

      <!-- Navigation Links -->
      <nav class="flex items-center gap-1 rounded-xl border border-slate-800 bg-slate-900/60 p-1">
        <a
          routerLink="/"
          routerLinkActive="bg-blue-600 text-white shadow-md"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-lg px-4 py-1.5 text-xs font-semibold text-slate-400 hover:text-white transition">
          Upload Clip
        </a>
        <a
          routerLink="/matches"
          routerLinkActive="bg-blue-600 text-white shadow-md"
          class="rounded-lg px-4 py-1.5 text-xs font-semibold text-slate-400 hover:text-white transition">
          Matches List
        </a>
      </nav>
    </div>
  </header>

  <!-- Router Outlet Container -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-900 bg-slate-950 py-6 text-center text-xs text-slate-500">
    <div class="mx-auto max-w-7xl px-4">
      Football Intelligence Dashboard &copy; 2026. Pluggable Analytics Engine v1.0
    </div>
  </footer>
</div>
